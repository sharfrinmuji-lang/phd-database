<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PhD Database Portal</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

  <!-- Background Watermark -->
  <div id="toast-container"></div>
  <div class="background-watermark"></div>


  <!-- Professional Header -->
  <header>
    <img src="images/banner.jpeg" alt="College Banner" class="header-banner">
  </header>

  <div class="main-content">
    <div class="login-container">

      <!-- LOGIN FORM -->
      <div id="loginSection">
        <div class="login-header">
          <h2>Welcome Back</h2>
          <p>Please login to access your dashboard</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn-primary">Login</button>
        </form>
        <a class="toggle-link" onclick="toggleForms()">New User? Register here</a>
      </div>

      <!-- REGISTER FORM -->
      <div id="registerSection" class="hidden">
        <div class="login-header">
          <h2>Registration</h2>
          <p>Create a new account</p>
        </div>
        <form id="registerForm">
          <div class="form-group">
            <input type="text" id="regUsername" placeholder="Choose Username" required>
          </div>
          <div class="form-group">
            <select id="regDesignation" required>
              <option value="" disabled selected>Select Designation</option>
              <option value="Student">Student</option>
              <option value="Staff">Staff</option>
              <option value="HOD">HOD</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div class="form-group">
            <input type="email" id="regEmail" placeholder="Email ID" required>
          </div>
          <div class="form-group">
            <input type="password" id="regPassword" placeholder="Choose Password" required>
          </div>
          <div class="form-group">
            <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
          </div>
          <button type="submit" class="btn-primary">Register</button>
        </form>
        <a class="toggle-link" onclick="toggleForms()">Already have an account? Login</a>
      </div>

    </div>
  </div>

  <script>
    // Initialize registered users from localStorage or empty array
    let registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];

    // PREMIUM TOAST SYSTEM
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      let icon = 'info-circle';
      if (type === 'success') icon = 'check-circle';
      if (type === 'error') icon = 'exclamation-circle';
      if (type === 'warning') icon = 'exclamation-triangle';

      toast.innerHTML = `
        <i class="fas fa-${icon}"></i>
        <div class="toast-message">${message}</div>
      `;

      container.appendChild(toast);

      // Trigger animation
      setTimeout(() => toast.classList.add('show'), 10);

      // Remove after 4 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function toggleForms() {
      document.getElementById('loginSection').classList.toggle('hidden');
      document.getElementById('registerSection').classList.toggle('hidden');
      document.getElementById('loginForm').reset();
      document.getElementById('registerForm').reset();
    }

    function attemptLocalLogin(username, password) {
      console.log('Checking local storage for:', username);

      // 1. Check Hardcoded Admins
      if (username === "lithikka" || username === "admin") {
        showToast("Backend unreachable. Logging in as Admin (Offline).", "info");
        localStorage.setItem("loggedInUser", "System Administrator");
        localStorage.setItem("userRole", "Admin");
        localStorage.setItem("userEmail", "admin@psgrkcw.ac.in");
        window.location.href = "dashboard.html";
        return true;
      }

      // 2. Check Locally Registered Users
      const localUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];
      const localUser = localUsers.find(u => u.username === username && u.password === password);

      if (localUser) {
        console.log("Found in local storage:", localUser);
        showToast("Login successful (Offline Mode)!", "success");
        localStorage.setItem("loggedInUser", localUser.username);
        localStorage.setItem("userRole", localUser.designation || localUser.role);
        localStorage.setItem("userEmail", localUser.email || "");
        window.location.href = "dashboard.html";
        return true;
      }
      return false;
    }

    // HANDLE LOGIN
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const response = await fetch('http://localhost:5002/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem("loggedInUser", data.username);
          localStorage.setItem("userRole", data.role);
          localStorage.setItem("userEmail", data.email);
          localStorage.setItem("authToken", data.token);
          window.location.href = "dashboard.html";
        } else {
          // Backend responded but failed (e.g. 400 User Not Found because DB is empty)
          console.warn("Backend rejected login, trying local:", data.message);
          if (!attemptLocalLogin(username, password)) {
            showToast(data.message || "Invalid credentials", "error");
          }
        }
      } catch (error) {
        console.warn('Network error, trying local:', error);
        // Network Error (Backend unreachable)
        if (!attemptLocalLogin(username, password)) {
          showToast("Server unreachable. Please check your connection.", "error");
        }
      }
    });

    // HANDLE REGISTRATION
    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("regUsername").value.trim();
      const designation = document.getElementById("regDesignation").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      const confirmPass = document.getElementById("regConfirmPassword").value.trim();

      if (password !== confirmPass) {
        showToast("Passwords do not match!", "warning");
        return;
      }

      if (username.length < 3) {
        showToast("Username too short!", "warning");
        return;
      }

      try {
        const response = await fetch('http://localhost:5002/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, email, role: designation })
        });

        const data = await response.json();

        if (response.ok) {
          showToast("Registration successful! Please login.", "success");
          toggleForms();
        } else {
          throw new Error(data.message || "Registration failed");
        }
      } catch (error) {
        console.warn('Backend registration failed, falling back to local storage:', error);

        // Local Fallback
        const newUser = { username, password, email, designation };
        registeredUsers.push(newUser);
        localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));

        showToast("Registration successful (Offline)! Please login.", "success");
        toggleForms();
      }
    });
  </script>

</body>

</html>
